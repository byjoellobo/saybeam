# Categories for GitHub's automatically generated release notes: the list of
# merged pull requests under each release. The Release workflow puts the
# matching CHANGELOG.md section above it. A pull request goes in the first
# category whose label it has. The issue forms add "bug", "enhancement" and
# "field-test"; Dependabot adds "dependencies".
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: New features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Accessibility
      labels:
        - accessibility
    - title: Field tests and speech accuracy
      labels:
        - field-test
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
