# Prebuilt relay binaries for teachers, plus the self-hosting Docker image.
#
# Tag a release (git tag v1.1.0 && git push --tags) to build every platform,
# attach the archives and SHA256SUMS to the GitHub release, and push the image
# to ghcr.io. Run it by hand (workflow_dispatch) to build everything without
# publishing a release; the image is then pushed with a sha-* tag only.
name: Release relay

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Footer "Source code" link in the web app (AGPL-3.0 section 13).
  SAYBEAM_SOURCE_URL: https://github.com/${{ github.repository }}

jobs:
  web:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package and crate versions
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          crate="$(grep -m1 '^version' relay/Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match package.json ($pkg) and relay/Cargo.toml ($crate)"
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  relay:
    name: Relay (${{ matrix.target }})
    needs: web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # Oldest supported Ubuntu runner: an older glibc runs on more Linux distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: relay -> target
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --manifest-path relay/Cargo.toml --target ${{ matrix.target }}
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then version="dev-${GITHUB_SHA::7}"; fi
          name="saybeam-relay-${version}-${TARGET}"
          exe="saybeam-relay"
          if [[ "${TARGET}" == *windows* ]]; then exe="${exe}.exe"; fi
          mkdir -p "staging/${name}" out
          cp "relay/target/${TARGET}/release/${exe}" "staging/${name}/"
          cp relay/README.md "staging/${name}/README.md"
          cp LICENSE "staging/${name}/LICENSE"
          cp relay/THIRD_PARTY_LICENSES.md "staging/${name}/"
          cd staging
          if [[ "${ARCHIVE}" == "zip" ]]; then
            7z a -tzip "../out/${name}.zip" "${name}" > /dev/null
          else
            tar -czf "../out/${name}.tar.gz" "${name}"
          fi
          ls -l ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: relay
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relay-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Keep the bundle (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-bundle
          path: dist/*
          retention-days: 7
      - name: Attach to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true

  docker:
    name: Docker image (ghcr.io)
    needs: relay
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # On version tags: 1.2.3, 1.2 and latest (stable versions only).
          # On manual runs: sha-<short sha>.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.ref_type != 'tag' }}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SAYBEAM_SOURCE_URL=${{ env.SAYBEAM_SOURCE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
