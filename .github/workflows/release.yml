# Builds and publishes a release when a version tag is pushed.
#
#   npm run release -- 0.3.0      (then commit, see docs/releasing.md)
#   git tag -a v0.3.0 -m "Saybeam v0.3.0" && git push origin v0.3.0
#
#   check    the tag, every package.json, relay/Cargo.toml, wrangler.jsonc
#            and CHANGELOG.md agree (scripts/release.mjs --check), and the
#            tagged commit is on main
#   web      builds the web app and zips it as saybeam-web-<version>.zip
#   relay    builds saybeam-relay-<version>-<target> for four platforms
#   docker   pushes the self-hosting image to ghcr.io
#   bundle   SHA256SUMS for every archive
#   publish  build provenance attestations, then the GitHub release with the
#            matching CHANGELOG.md section as its notes
#   deploy   starts deploy.yml (Cloudflare). A release created with the
#            workflow token does not fire `release: published` by itself.
#
# Run it by hand (workflow_dispatch) for a dry run: everything is built and
# kept as workflow artifacts for 7 days, the image is pushed with a sha-* tag
# only, and nothing is released or deployed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Footer "Source code" link in the web app (AGPL-3.0 section 13).
  SAYBEAM_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to check below that a release tag is on main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Only a pushed tag publishes. A manual run is a dry run, even on a tag.
      - name: Versions agree, and match the tag
        id: version
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            node scripts/release.mjs --check "${GITHUB_REF_NAME}"
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::${GITHUB_REF_NAME} is not on main. Tag a commit that has landed on main (docs/releasing.md)."
              exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/release.mjs --check
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          node scripts/changelog-section.mjs "$(node -p "require('./package.json').version")" > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  web:
    name: Web app
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # The relay jobs embed this build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          name="saybeam-web-${VERSION}"
          mkdir -p "staging/${name}" out
          cp -R apps/web/dist/. "staging/${name}/"
          cp LICENSE THIRD_PARTY_NOTICES.md "staging/${name}/"
          (cd staging && zip -q -r -X "../out/${name}.zip" "${name}")
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-archive
          path: out/*
          if-no-files-found: error
          retention-days: 7

  relay:
    name: Relay (${{ matrix.target }})
    needs: [check, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          # Oldest supported Ubuntu runner: an older glibc runs on more Linux distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: relay -> target
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --manifest-path relay/Cargo.toml --target ${{ matrix.target }}
      - name: Package
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name="saybeam-relay-${VERSION}-${TARGET}"
          exe="saybeam-relay"
          if [[ "${TARGET}" == *windows* ]]; then exe="${exe}.exe"; fi
          mkdir -p "staging/${name}" out
          cp "relay/target/${TARGET}/release/${exe}" "staging/${name}/"
          cp relay/README.md "staging/${name}/README.md"
          cp LICENSE "staging/${name}/LICENSE"
          cp relay/THIRD_PARTY_LICENSES.md "staging/${name}/"
          cd staging
          if [[ "${ARCHIVE}" == "zip" ]]; then
            7z a -tzip "../out/${name}.zip" "${name}" > /dev/null
          else
            tar -czf "../out/${name}.tar.gz" "${name}"
          fi
          ls -l ../out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relay-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker image (ghcr.io)
    needs: [check, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Pushed tag v1.2.3: 1.2.3, 1.2 and latest (latest and 1.2 for stable versions only).
          # Manual run: sha-<short sha> only.
          tags: |
            type=semver,pattern={{version}},enable=${{ needs.check.outputs.publish == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.check.outputs.publish == 'true' && !contains(github.ref_name, '-') }}
            type=sha,enable=${{ needs.check.outputs.publish != 'true' }}
          flavor: |
            latest=${{ needs.check.outputs.publish == 'true' && !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SAYBEAM_SOURCE_URL=${{ env.SAYBEAM_SOURCE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bundle:
    name: Checksums
    needs: [web, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: relay-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-archive
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- saybeam-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [check, bundle, docker]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestations (Sigstore)
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/saybeam-*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            # A re-run: refresh the files and leave the notes alone (they may have been edited).
            echo "::notice::Release ${TAG} already exists; replacing its files only."
            gh release upload "${TAG}" dist/* --clobber
            exit 0
          fi
          flags=()
          if [[ "${TAG}" == *-* ]]; then flags+=(--prerelease); fi
          # The CHANGELOG.md section comes first; --generate-notes appends the
          # merged pull requests, grouped by .github/release.yml.
          gh release create "${TAG}" dist/* \
            --verify-tag \
            --title "Saybeam ${TAG}" \
            --notes-file notes/release-notes.md \
            --generate-notes \
            "${flags[@]}"

  deploy:
    name: Start the Cloudflare deploy
    needs: publish
    # Prereleases are not deployed automatically. Run deploy.yml by hand to deploy one.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch deploy.yml
    steps:
      - name: Dispatch deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh workflow run deploy.yml --ref "${TAG}"
