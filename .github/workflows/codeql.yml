# CodeQL code scanning: the TypeScript (web app, Worker, protocol, scripts),
# the Rust relay, and these workflow files. Results appear under the
# repository's Security tab, and on pull requests as checks.
#
# This is CodeQL "advanced setup": leave "default setup" off in the
# repository settings, or the two will conflict. See docs/ci-cd.md.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 04:23 UTC, so new queries also run on code that has not changed.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        # None of these needs a build: CodeQL reads the source directly.
        # Rust is generally available in CodeQL since 2.23.3 (October 2025).
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: /language:${{ matrix.language }}
