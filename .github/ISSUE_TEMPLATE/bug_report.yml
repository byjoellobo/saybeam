name: Bug report
description: Something in Caption Room is broken or does not work as described.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please search the [open issues](https://github.com/mezpos/caption-room/issues) first, in case someone has already reported it.

        **Is it a security problem?** Please do not file it here. Report it privately instead, as described in [SECURITY.md](https://github.com/mezpos/caption-room/blob/main/SECURITY.md).

        **Do not paste room codes or links.** Speaker, corrector, hand-off and private-room links (anything with `#` in it) are keys to the room. Replace them with `CODE` or `LINK`.

  - type: dropdown
    id: area
    attributes:
      label: Which part of Caption Room?
      options:
        - Speaker console (/speak)
        - Listener view (/r)
        - Corrector view (/fix)
        - Field-test bench (/bench)
        - Home page or creating a room
        - LAN relay (Rust)
        - Cloud Worker or Durable Object
        - Documentation
        - Something else
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Where is it running?
      options:
        - Cloud (a deployed Cloudflare Worker)
        - LAN relay on a laptop
        - Local development (wrangler dev or Vite)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Speech engine, if it matters
      options:
        - Not related to speech recognition
        - Moonshine Tiny (on this device)
        - Moonshine Base (on this device)
        - Whisper Tiny English (on this device)
        - Whisper Base (on this device)
        - Whisper Small (on this device)
        - Browser speech (speech service)
        - Browser speech (on-device mode)
        - WhisperLive server
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw. Screenshots help a lot.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest list of steps that shows the problem.
      placeholder: |
        1. Create a room on a laptop
        2. Join as a listener on an Android phone
        3. Turn Wi-Fi off for 30 seconds, then on again
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: "Example: Redmi 12C, Android 14"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Example: Chrome 142"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Caption Room version or commit
      description: The `version` field of `/api/info` on your server, or the commit you built from.
      placeholder: "Example: 0.1.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console output or relay output. Remove room codes, links and names first.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: This report contains no room codes, room links or personal details.
          required: true
