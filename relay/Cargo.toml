[package]
name = "saybeam-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Saybeam LAN relay: live captions over school Wi-Fi with no internet needed"
license = "AGPL-3.0-or-later"
repository = "https://github.com/byjoellobo/saybeam"
publish = false

[lib]
name = "saybeam_relay"
path = "src/lib.rs"

[[bin]]
name = "saybeam-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
local-ip-address = "0.6.13"
mime_guess = "2.0.5"
percent-encoding = "2.3"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
rust-embed = "8.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = "0.30.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
